[project]
name = "luantimodsbackend"
version = "0.1.0"
description = "Shared in-game book library API for Luanti (Minetest) servers"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "falcon>=4.3.1",
    "granian>=2.8.3",
    "msgspec>=0.21.1",
    "sqlalchemy[asyncio]>=2.0.54",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "watchfiles>=1.2.0",
]
